<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --ink: #1a1a17;
    --muted: #6b6a63;
    --faint: #a3a299;
    --line: #e6e4dc;
    --accent: #1a1a17;
    --done: #9b9a91;
    --radius: 10px;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --serif: 'Newsreader', Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f;
      --surface: #1f1e17;
      --ink: #ecebe3;
      --muted: #9c9a8f;
      --faint: #6a6960;
      --line: #2e2d24;
      --accent: #ecebe3;
      --done: #6a6960;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 28px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-weight: 500;
    font-size: 2rem;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 6px;
    font-family: var(--mono);
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 24px 120px;
  }
  .day {
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
  }
  .day-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }
  .day-date {
    font-family: var(--mono);
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .day-weekday { color: var(--faint); font-size: 0.85rem; font-family: var(--mono); }
  .day-count { margin-left: auto; color: var(--faint); font-size: 0.8rem; font-family: var(--mono); }
  ul.tasks { list-style: none; }
  li.task {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 7px 10px;
    margin: 2px -10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s;
    font-family: var(--mono);
    font-size: 0.92rem;
  }
  li.task:hover { background: var(--surface); }
  .box { color: var(--muted); white-space: pre; flex-shrink: 0; }
  .task.done .box { color: var(--done); }
  .title { flex: 1; }
  .task.done .title { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
  .time { color: var(--faint); font-size: 0.8rem; flex-shrink: 0; }
  .empty { color: var(--faint); font-style: italic; font-family: var(--serif); padding: 4px 0; }

  /* 팝업 */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,19,15,0.4);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px; z-index: 50;
    backdrop-filter: blur(2px);
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    max-width: 600px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    padding: 32px 36px;
    animation: pop 0.16s ease-out;
  }
  @keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .modal-head h2 { font-weight: 500; font-size: 1.4rem; letter-spacing: -0.01em; flex: 1; }
  .modal-meta { font-family: var(--mono); font-size: 0.8rem; color: var(--faint); margin-bottom: 18px; }
  .close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.4rem; line-height: 1; padding: 0 4px; }
  .close:hover { color: var(--ink); }
  .detail { font-size: 1rem; line-height: 1.7; }
  .detail h1,.detail h2,.detail h3 { font-weight: 500; margin: 1em 0 0.4em; }
  .detail p { margin: 0.7em 0; }
  .detail ul,.detail ol { margin: 0.7em 0; padding-left: 1.4em; }
  .detail li { margin: 0.2em 0; }
  .detail code { font-family: var(--mono); font-size: 0.85em; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .detail pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0.8em 0; }
  .detail pre code { background: none; padding: 0; font-size: 0.82rem; line-height: 1.5; }
  .detail strong { font-weight: 500; }
  .detail blockquote { border-left: 2px solid var(--line); padding-left: 14px; color: var(--muted); margin: 0.8em 0; }
  .loading { text-align: center; color: var(--faint); padding: 60px 0; font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <h1>Daily Log</h1>
  <p id="subtitle">기록을 불러오는 중…</p>
</header>
<main id="root">
  <div class="loading">불러오는 중…</div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="m-title"></h2>
      <button class="close" id="m-close" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-meta" id="m-meta"></div>
    <div class="detail" id="m-detail"></div>
  </div>
</div>

<script src="vendor/marked.min.js"></script>
<script>
const WEEKDAYS = ['일','월','화','수','목','금','토'];

function fmtWeekday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return WEEKDAYS[d.getDay()] + '요일';
}

async function load() {
  let data;
  try {
    const res = await fetch('data.json', { cache: 'no-cache' });
    data = await res.json();
  } catch (e) {
    document.getElementById('root').innerHTML =
      '<div class="loading">data.json 을 불러오지 못했습니다.</div>';
    return;
  }
  render(data);
}

function render(data) {
  const root = document.getElementById('root');
  // 최신 날짜가 위로 오도록 내림차순
  const dates = Object.keys(data).sort().reverse();

  if (dates.length === 0) {
    root.innerHTML = '<div class="loading">아직 기록이 없습니다.</div>';
    return;
  }

  let totalDone = 0, total = 0;
  root.innerHTML = '';

  for (const date of dates) {
    const tasks = data[date];
    const done = tasks.filter(t => t.done).length;
    totalDone += done; total += tasks.length;

    const day = document.createElement('section');
    day.className = 'day';

    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML =
      `<span class="day-date">${date}</span>` +
      `<span class="day-weekday">${fmtWeekday(date)}</span>` +
      `<span class="day-count">${done}/${tasks.length}</span>`;
    day.appendChild(head);

    if (tasks.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = '기록 없음';
      day.appendChild(e);
    } else {
      const ul = document.createElement('ul');
      ul.className = 'tasks';
      tasks.forEach((task, i) => {
        const li = document.createElement('li');
        li.className = 'task' + (task.done ? ' done' : '');
        const mark = task.done ? '[o]' : '[ ]';
        li.innerHTML =
          `<span class="box">${mark}</span>` +
          `<span class="title"></span>` +
          (task.time ? `<span class="time">${task.time}</span>` : '');
        li.querySelector('.title').textContent = task.title;
        li.addEventListener('click', () => openModal(task, date));
        ul.appendChild(li);
      });
      day.appendChild(ul);
    }
    root.appendChild(day);
  }

  document.getElementById('subtitle').textContent =
    `${dates.length}일 기록 · 완료 ${totalDone}/${total}`;
}

function openModal(task, date) {
  document.getElementById('m-title').textContent = task.title;
  const meta = [date, task.time, task.done ? '완료' : '미완료']
    .filter(Boolean).join('  ·  ');
  document.getElementById('m-meta').textContent = meta;
  document.getElementById('m-detail').innerHTML =
    task.detail ? marked.parse(task.detail) : '<p style="color:var(--faint)">상세 내용 없음</p>';
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('m-close').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

load();
</script>
</body>
</html>
